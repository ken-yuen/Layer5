name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: build + verify-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Install staticcheck (pinned)
        run: |
          mkdir -p "$RUNNER_TEMP/ykc-bin"
          GOBIN="$RUNNER_TEMP/ykc-bin" go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          echo "$RUNNER_TEMP/ykc-bin" >> "$GITHUB_PATH"

      - name: Setup Rust (locked to deploy/rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Install rust-analyzer (locked for LSP test)
        run: |
          RA_VERSION=2026-08-17.4
          RA_SHA256=a559eaa29920e4c12718fba101f2055f1da0ad8bc458ef9dc1a670778cc66901
          curl -fsSL "https://github.com/rust-lang/rust-analyzer/releases/download/${RA_VERSION}/rust-analyzer-x86_64-unknown-linux-gnu.gz" -o /tmp/rust-analyzer.gz
          printf '%s  %s\n' "$RA_SHA256" /tmp/rust-analyzer.gz | sha256sum -c -
          gunzip -c /tmp/rust-analyzer.gz > /usr/local/bin/rust-analyzer
          chmod +x /usr/local/bin/rust-analyzer
          rust-analyzer --version

      - name: lint (gofmt + vet + staticcheck all)
        run: make lint

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

      - name: L5 ChordLaw 回歸（19 項）
        run: |
          python3 --version
          make l5-test

      - name: make binaries
        run: make binaries

      - name: make verify-all (全功能實測)
        run: make verify-all

  release:
    name: release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Build static binaries (linux-amd64)
        run: |
          mkdir -p dist/ykc
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/ykc/ykc             ./cmd/ykc-smoke
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/ykc/ykc-judge       ./cmd/ykc-judge
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/ykc/ykc-guard       ./cmd/ykc-guard
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/ykc/ykc-lsp         ./cmd/ykc-lsp
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/ykc/ykc-panel       ./cmd/ykc-panel
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/ykc/ykc-atom        ./cmd/ykc-atom
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/ykc/ykc-precompile  ./cmd/ykc-precompile
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/ykc/ykc-serve       ./cmd/ykc-serve
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/ykc/ykc-know        ./cmd/ykc-know
          # L5 引擎（ykc-judge/ykc-guard 的幾何解釋依賴; 執行檔旁 l5/chordlaw 自動探測）
          mkdir -p dist/ykc/l5
          cp -r l5/chordlaw dist/ykc/l5/
          rm -rf dist/ykc/l5/chordlaw/examples/out dist/ykc/l5/chordlaw/.oracle_tmp dist/ykc/l5/chordlaw/__pycache__
          tar czf dist/ykc-linux-amd64.tar.gz -C dist ykc

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ykc-linux-amd64.tar.gz
