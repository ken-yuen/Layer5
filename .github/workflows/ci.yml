name: CI

# T-21b（YKC_22）：CI 拆 lane——
#   core-lane      無 Rust 工具鏈；秒級；驗證「使用前解耦」不變式（A1/A2）
#   toolchain-lane 鎖版 Rust；契約測試鎖定 cargo JSON / r-a 行為
#   nightly-drift  每晚以最新 stable 跑契約測試；漂移提前現形，不擋 merge
#
# 注：make verify-all 暫不入 CI——其 capability-test 依賴的 cmd/ykc-cap 等
#     YKC_21 代碼尚未落庫（見 YKC_23 執行報告）；落庫後恢復。

on:
  push:
    branches: [main, ykc-serve-datalog]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 19 * * *" # 每日 UTC 19:17（HKT 03:17）drift 檢查

permissions:
  contents: read

jobs:
  core:
    name: core-lane（零 Rust 依賴）
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Install staticcheck (pinned)
        run: |
          mkdir -p "$RUNNER_TEMP/ykc-bin"
          GOBIN="$RUNNER_TEMP/ykc-bin" go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          echo "$RUNNER_TEMP/ykc-bin" >> "$GITHUB_PATH"

      - name: 確保環境無 Rust（core-lane 不變式；runner 預裝則先屏蔽）
        run: |
          # hosted runner 可能預裝 rustup/cargo——core-lane 的意義是「零 Rust 也全綠」，
          # 故先移除預裝二進制再斷言，而不是因 runner 鏡像變化而誤紅。
          for tool in cargo rustc rust-analyzer rustup; do
            while p="$(command -v "$tool" 2>/dev/null)"; do
              echo "移除 runner 預裝 $p"
              sudo rm -f "$p" || rm -f "$p"
              hash -r
            done
          done
          if command -v cargo >/dev/null 2>&1; then
            echo "::error::無法屏蔽 cargo——core-lane 解耦驗證失效"; exit 1
          fi
          echo "✅ 環境確認零 Rust"

      - name: lint (gofmt + vet + staticcheck + toolchain-guard)
        run: make lint

      - name: go build
        run: go build ./...

      - name: go test（無 Rust——replay fixture + 假 LSP server；A1 驗收）
        run: go test ./...

      - name: 跨平台交叉編譯煙測（分發解耦）
        run: |
          GOOS=darwin  GOARCH=arm64 go build -o /dev/null ./cmd/ykc-serve
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/ykc-serve
          GOOS=linux   GOARCH=arm64 go build -o /dev/null ./cmd/ykc-doctor

      - name: make binaries
        run: make binaries

  toolchain:
    name: toolchain-lane（鎖版 Rust 契約）
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Setup Rust (locked to deploy/rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy, rust-analyzer

      - name: Install rust-analyzer (locked for LSP test)
        run: |
          RA_VERSION=2026-08-17.4
          RA_SHA256=a559eaa29920e4c12718fba101f2055f1da0ad8bc458ef9dc1a670778cc66901
          curl -fsSL "https://github.com/rust-lang/rust-analyzer/releases/download/${RA_VERSION}/rust-analyzer-x86_64-unknown-linux-gnu.gz" -o /tmp/rust-analyzer.gz
          printf '%s  %s\n' "$RA_SHA256" /tmp/rust-analyzer.gz | sha256sum -c -
          gunzip -c /tmp/rust-analyzer.gz > /usr/local/bin/rust-analyzer
          chmod +x /usr/local/bin/rust-analyzer
          rust-analyzer --version

      - name: 契約測試（cargo JSON 診斷格式鎖定；skip 轉 fail）
        run: make contract-test

      - name: go test（含真工具鏈路徑）
        run: go test ./...

      - name: ykc doctor（顯性探測，工件留檔）
        run: |
          go build -o bin/ykc-doctor ./cmd/ykc-doctor
          ./bin/ykc-doctor -json | tee doctor-report.json
          ./bin/ykc-doctor -strict

      - name: L5 ChordLaw 回歸（19 項）
        run: |
          python3 --version
          make l5-test

  nightly-drift:
    name: nightly-drift（latest stable 漂移偵察）
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Setup Rust (floating latest stable —— 故意不鎖)
        uses: dtolnay/rust-toolchain@stable

      - name: 契約測試 vs latest stable
        run: make contract-test
        # 失敗 = cargo JSON / rustc 行為漂移預警：開 issue 處理，不阻塞 merge lane

  release:
    name: release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [core, toolchain]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Build static binaries (linux-amd64)
        run: |
          mkdir -p dist/ykc
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/ykc/ykc             ./cmd/ykc-smoke
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/ykc/ykc-judge       ./cmd/ykc-judge
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/ykc/ykc-guard       ./cmd/ykc-guard
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/ykc/ykc-lsp         ./cmd/ykc-lsp
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/ykc/ykc-panel       ./cmd/ykc-panel
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/ykc/ykc-atom        ./cmd/ykc-atom
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/ykc/ykc-precompile  ./cmd/ykc-precompile
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/ykc/ykc-serve       ./cmd/ykc-serve
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/ykc/ykc-know        ./cmd/ykc-know
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/ykc/ykc-doctor      ./cmd/ykc-doctor
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/ykc/ykc-rustd       ./cmd/ykc-rustd
          # L5 引擎（ykc-judge/ykc-guard 的幾何解釋依賴; 執行檔旁 l5/chordlaw 自動探測）
          mkdir -p dist/ykc/l5
          cp -r l5/chordlaw dist/ykc/l5/
          rm -rf dist/ykc/l5/chordlaw/examples/out dist/ykc/l5/chordlaw/.oracle_tmp dist/ykc/l5/chordlaw/__pycache__
          tar czf dist/ykc-linux-amd64.tar.gz -C dist ykc

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ykc-linux-amd64.tar.gz
